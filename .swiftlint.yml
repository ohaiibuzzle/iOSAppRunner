# SwiftLint configuration for BaseiOSApp.
# Runs as a build phase on the BaseiOSAppHost target. Lint failures are
# warnings, not build errors, unless a rule is escalated to `error`.

included:
  - Host

excluded:
  - build
  - Host/build

# Keep the noise down: the codebase predates SwiftLint, so start with the
# sensible defaults and opt into a few extras rather than wall-of-warnings.
opt_in_rules:
  - empty_count
  - closure_spacing
  - first_where
  - last_where
  - sorted_imports
  - toggle_bool

disabled_rules:
  # String(decoding:as:) is lossy on purpose for argv and tool output; the
  # failable initializer would drop the whole string on one bad byte.
  - optional_data_string_conversion

large_tuple:
  warning: 3

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

identifier_name:
  # Allow short names commonly used in C-interop / plist code.
  min_length: 1
  allowed_symbols: ["_"]

type_body_length:
  warning: 400

function_body_length:
  warning: 80
